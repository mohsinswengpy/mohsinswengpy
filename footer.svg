<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#049FD9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7B2FF7"/>
      <stop offset="100%" stop-color="#ff2d87" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#7B2FF7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="130" fill="url(#spot)"/>
  <rect x="100" y="20" width="1000" height="2" fill="url(#line)"/>

  <circle cy="21" r="3.5" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cx" values="100;1100" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="68" font-size="18" fill="#a9cde0" letter-spacing="1">Thanks for visiting</text>
    <text x="600" y="98" font-size="13" fill="#5d7e95" letter-spacing="3">BUILT WITH</text>
  </g>

  <g transform="translate(683,92)" filter="url(#glow)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.3;1;1.2;1" keyTimes="0;0.15;0.3;0.45;1" dur="1.4s" repeatCount="indefinite"/>
      <path transform="translate(-8,-8) scale(0.67)" fill="#ff4d8d" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </g>
  </g>
</svg>
