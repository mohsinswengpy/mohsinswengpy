<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 420" width="1200" height="420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a18">
        <animate attributeName="stop-color" values="#050a18;#0b1230;#050a18" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#0a1a3a">
        <animate attributeName="stop-color" values="#0a1a3a;#1a0f3a;#0a1a3a" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1b0b3d">
        <animate attributeName="stop-color" values="#1b0b3d;#04304a;#1b0b3d" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#6fd3ff"/>
      <stop offset="100%" stop-color="#b58cff"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#049FD9"/>
      <stop offset="100%" stop-color="#7B2FF7"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#049FD9" stroke-opacity="0.08" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="round"><rect width="1200" height="420" rx="28"/></clipPath>

    <path id="heart" d="M0,-3 C-1,-8 -9,-8 -9,-2 C-9,3 -3,7 0,10 C3,7 9,3 9,-2 C9,-8 1,-8 0,-3 Z"/>

    <path id="e1" d="M120,90 L300,330"/>
    <path id="e2" d="M300,330 L520,70"/>
    <path id="e3" d="M520,70 L760,340"/>
    <path id="e4" d="M760,340 L980,90"/>
    <path id="e5" d="M980,90 L1100,300"/>
    <path id="e6" d="M120,90 L520,70"/>
    <path id="e7" d="M520,70 L980,90"/>
    <path id="e8" d="M300,330 L760,340"/>
    <path id="e9" d="M760,340 L1100,300"/>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>

    <!-- network links with flowing dashes -->
    <g stroke="#049FD9" stroke-opacity="0.45" stroke-width="1.6" fill="none" stroke-dasharray="6 8">
      <use xlink:href="#e1" href="#e1"/><use xlink:href="#e2" href="#e2"/><use xlink:href="#e3" href="#e3"/>
      <use xlink:href="#e4" href="#e4"/><use xlink:href="#e5" href="#e5"/><use xlink:href="#e6" href="#e6"/>
      <use xlink:href="#e7" href="#e7"/><use xlink:href="#e8" href="#e8"/><use xlink:href="#e9" href="#e9"/>
      <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.6s" repeatCount="indefinite"/>
    </g>

    <!-- data packets travelling along links -->
    <g filter="url(#glow)">
      <circle r="4" fill="#6fd3ff"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath xlink:href="#e1" href="#e1"/></animateMotion></circle>
      <circle r="4" fill="#b58cff"><animateMotion dur="3.8s" begin="0.6s" repeatCount="indefinite"><mpath xlink:href="#e2" href="#e2"/></animateMotion></circle>
      <circle r="4" fill="#6fd3ff"><animateMotion dur="4.4s" begin="1.1s" repeatCount="indefinite"><mpath xlink:href="#e3" href="#e3"/></animateMotion></circle>
      <circle r="4" fill="#ff6fae"><animateMotion dur="3.6s" begin="0.3s" repeatCount="indefinite"><mpath xlink:href="#e4" href="#e4"/></animateMotion></circle>
      <circle r="4" fill="#6fd3ff"><animateMotion dur="3s" begin="1.4s" repeatCount="indefinite"><mpath xlink:href="#e5" href="#e5"/></animateMotion></circle>
      <circle r="4" fill="#b58cff"><animateMotion dur="5s" begin="0.2s" repeatCount="indefinite"><mpath xlink:href="#e6" href="#e6"/></animateMotion></circle>
      <circle r="4" fill="#6fd3ff"><animateMotion dur="6s" begin="0.9s" repeatCount="indefinite"><mpath xlink:href="#e7" href="#e7"/></animateMotion></circle>
      <circle r="4" fill="#ff6fae"><animateMotion dur="5.4s" begin="1.8s" repeatCount="indefinite"><mpath xlink:href="#e8" href="#e8"/></animateMotion></circle>
      <circle r="4" fill="#6fd3ff"><animateMotion dur="4.2s" begin="0.5s" repeatCount="indefinite"><mpath xlink:href="#e9" href="#e9"/></animateMotion></circle>
    </g>

    <!-- router nodes with pulse rings -->
    <g fill="#050a18" stroke="#049FD9" stroke-width="2.5" filter="url(#glow)">
      <circle cx="120" cy="90" r="10"/><circle cx="300" cy="330" r="10"/><circle cx="520" cy="70" r="10"/>
      <circle cx="760" cy="340" r="10"/><circle cx="980" cy="90" r="10"/><circle cx="1100" cy="300" r="10"/>
    </g>
    <g fill="none" stroke="#049FD9" stroke-width="1.5">
      <circle cx="120" cy="90" r="10"><animate attributeName="r" values="10;32" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.8;0" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="330" r="10"><animate attributeName="r" values="10;32" dur="3s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.8;0" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="70" r="10"><animate attributeName="r" values="10;32" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.8;0" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="340" r="10"><animate attributeName="r" values="10;32" dur="3s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.8;0" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="90" r="10"><animate attributeName="r" values="10;32" dur="3s" begin="2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.8;0" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="300" r="10"><animate attributeName="r" values="10;32" dur="3s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.8;0" dur="3s" begin="2.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- floating hearts -->
    <g fill="#ff4d8d">
      <g transform="translate(90,450)"><g><animateMotion path="M0,0 L30,-500" dur="9s" repeatCount="indefinite"/><use xlink:href="#heart" href="#heart" transform="scale(1.2)"><animate attributeName="opacity" values="0;0.75;0.75;0" keyTimes="0;0.1;0.8;1" dur="9s" repeatCount="indefinite"/></use></g></g>
      <g transform="translate(260,450)"><g><animateMotion path="M0,0 L-20,-500" dur="11s" begin="2s" repeatCount="indefinite"/><use xlink:href="#heart" href="#heart" transform="scale(0.8)"><animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.1;0.8;1" dur="11s" begin="2s" repeatCount="indefinite"/></use></g></g>
      <g transform="translate(430,450)"><g><animateMotion path="M0,0 L25,-500" dur="8s" begin="4s" repeatCount="indefinite"/><use xlink:href="#heart" href="#heart" transform="scale(1.5)"><animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.8;1" dur="8s" begin="4s" repeatCount="indefinite"/></use></g></g>
      <g transform="translate(640,450)"><g><animateMotion path="M0,0 L-30,-500" dur="12s" begin="1s" repeatCount="indefinite"/><use xlink:href="#heart" href="#heart" transform="scale(0.9)"><animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.1;0.8;1" dur="12s" begin="1s" repeatCount="indefinite"/></use></g></g>
      <g transform="translate(830,450)"><g><animateMotion path="M0,0 L20,-500" dur="10s" begin="3s" repeatCount="indefinite"/><use xlink:href="#heart" href="#heart" transform="scale(1.3)"><animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.8;1" dur="10s" begin="3s" repeatCount="indefinite"/></use></g></g>
      <g transform="translate(1000,450)"><g><animateMotion path="M0,0 L-25,-500" dur="9.5s" begin="5s" repeatCount="indefinite"/><use xlink:href="#heart" href="#heart" transform="scale(1)"><animate attributeName="opacity" values="0;0.65;0.65;0" keyTimes="0;0.1;0.8;1" dur="9.5s" begin="5s" repeatCount="indefinite"/></use></g></g>
      <g transform="translate(1140,450)"><g><animateMotion path="M0,0 L-15,-500" dur="11s" begin="0.5s" repeatCount="indefinite"/><use xlink:href="#heart" href="#heart" transform="scale(1.1)"><animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.8;1" dur="11s" begin="0.5s" repeatCount="indefinite"/></use></g></g>
      <g transform="translate(540,450)"><g><animateMotion path="M0,0 L10,-500" dur="13s" begin="6s" repeatCount="indefinite"/><use xlink:href="#heart" href="#heart" transform="scale(0.7)"><animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.1;0.8;1" dur="13s" begin="6s" repeatCount="indefinite"/></use></g></g>
    </g>

    <!-- text -->
    <g text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="600" y="200" font-size="78" font-weight="800" fill="url(#textGrad)" filter="url(#glow)" opacity="0">
        Mohsin Khan
        <animate attributeName="opacity" from="0" to="1" dur="1.6s" fill="freeze"/>
      </text>
      <text x="600" y="250" font-size="24" fill="#9fd8f5" opacity="0">
        Software Engineering Student  |  Aspiring Network Engineer
        <animate attributeName="opacity" from="0" to="1" dur="1.6s" begin="0.6s" fill="freeze"/>
      </text>
      <text x="600" y="292" font-size="17" letter-spacing="5" fill="#b58cff" opacity="0">
        VLAN  •  OSPF  •  HSRP  •  IPsec VPN
        <animate attributeName="opacity" values="0;1;0.65;1" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      </text>
    </g>

    <rect x="2" y="2" width="1196" height="416" rx="26" fill="none" stroke="url(#border)" stroke-width="2.5" stroke-opacity="0.8"/>
  </g>
</svg>
