<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Mohsin Khan, aspiring DevOps engineer. A packet travels from a lab network through an IPsec tunnel to an AWS VPC." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#10203a" stroke-width="1"/></pattern>
<radialGradient id="glow" cx="78%" cy="52%" r="50%"><stop offset="0" stop-color="#0e7490" stop-opacity=".5"/><stop offset="1" stop-color="#050a14" stop-opacity="0"/></radialGradient>
<linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#f0faff"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
<path id="route" d="M 672 250 L 826 250 C 886 150 966 150 1026 250 L 1104 250"/>
<style>
.led{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.flow{stroke-dasharray:6 8;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.led,.flow,.blink{animation:none}}
</style>
</defs>
<rect width="1200" height="440" fill="#050a14"/>
<rect width="1200" height="440" fill="url(#grid)"/>
<rect width="1200" height="440" fill="url(#glow)"/>

<text x="60" y="165" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="68" font-weight="800" fill="url(#name)" letter-spacing="-1">Mohsin Khan</text>
<text x="62" y="215" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="600" fill="#5eead4">Aspiring DevOps Engineer</text>
<text x="62" y="254" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#8aa4bf">Building networks in the lab, now taking them to the cloud.</text>

<g font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="15" fill="#d7ecff">
<rect x="62" y="284" width="104" height="34" rx="17" fill="#0a1426" stroke="#1f3a5c"/><circle class="led" cx="84" cy="301" r="4.5" fill="#fbbf24"/><text x="98" y="306">CCNA</text>
<rect x="178" y="284" width="104" height="34" rx="17" fill="#0a1426" stroke="#1f3a5c"/><circle class="led" cx="200" cy="301" r="4.5" fill="#fbbf24" style="animation-delay:.4s"/><text x="214" y="306">Linux</text>
<rect x="294" y="284" width="104" height="34" rx="17" fill="#0a1426" stroke="#1f3a5c"/><circle class="led" cx="316" cy="301" r="4.5" fill="#fbbf24" style="animation-delay:.8s"/><text x="330" y="306">AWS</text>
</g>
<text x="62" y="348" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" fill="#6b86a3">amber = learning now</text>

<line x1="60" y1="388" x2="560" y2="388" stroke="#16294a"/>
<text x="62" y="414" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="15" fill="#34d399">$</text>
<text x="80" y="414" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="15" fill="#d7ecff">whoami</text>
<text x="146" y="414" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="15" fill="#8aa4bf">mohsin, software engineering student</text>
<rect class="blink" x="446" y="401" width="9" height="16" fill="#5eead4"/>

<!-- lab box -->
<rect x="640" y="150" width="230" height="170" rx="12" fill="#07101f" fill-opacity=".8" stroke="#2a4a73" stroke-dasharray="5 5"/>
<text x="656" y="174" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="12" fill="#7aa2c4">lab  192.168.0.0/16</text>
<!-- aws box -->
<rect x="972" y="150" width="196" height="170" rx="12" fill="#07101f" fill-opacity=".8" stroke="#2a4a73"/>
<text x="988" y="174" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="12" fill="#7aa2c4">AWS VPC  10.0.0.0/16</text>

<!-- links -->
<g stroke="#3b6aa0" stroke-width="2">
<line x1="688" y1="250" x2="722" y2="250"/><line x1="762" y1="250" x2="809" y2="250"/><line x1="1043" y1="250" x2="1086" y2="250"/>
</g>
<path d="M 826 250 C 886 150 966 150 1026 250" fill="none" stroke="#fbbf24" stroke-width="2.5" class="flow"/>
<text x="926" y="148" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="12" fill="#fbbf24">IPsec tunnel</text>

<!-- nodes -->
<g stroke="#5eead4" stroke-width="2" fill="#0a1a30">
<rect x="658" y="236" width="28" height="18" rx="3"/><line x1="672" y1="254" x2="672" y2="262"/><line x1="664" y1="262" x2="680" y2="262"/>
<rect x="722" y="242" width="40" height="16" rx="3"/>
<circle cx="826" cy="250" r="17"/>
<polygon points="1026,229 1044,240 1044,260 1026,271 1008,260 1008,240"/>
<rect x="1086" y="236" width="36" height="28" rx="4"/>
</g>
<g fill="#5eead4"><circle cx="732" cy="250" r="2"/><circle cx="742" cy="250" r="2"/><circle cx="752" cy="250" r="2"/></g>
<g font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="12" fill="#d7ecff" text-anchor="middle">
<text x="826" y="254">R1</text><text x="1026" y="254">VGW</text><text x="1104" y="254">EC2</text>
<text x="672" y="290" fill="#7aa2c4">PC</text><text x="742" y="290" fill="#7aa2c4">SW</text><text x="826" y="290" fill="#7aa2c4">edge</text>
<text x="1026" y="298" fill="#7aa2c4">gateway</text><text x="1104" y="298" fill="#7aa2c4">10.0.1.10</text>
</g>

<!-- packets -->
<circle r="5.5" fill="#fbbf24" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="4.5s" begin="0s" repeatCount="indefinite"><mpath href="#route" xlink:href="#route"/></animateMotion></circle>
<circle r="5.5" fill="#fbbf24" opacity="0"><set attributeName="opacity" to="1" begin="1.5s"/><animateMotion dur="4.5s" begin="1.5s" repeatCount="indefinite"><mpath href="#route" xlink:href="#route"/></animateMotion></circle>
<circle r="5.5" fill="#fbbf24" opacity="0"><set attributeName="opacity" to="1" begin="3s"/><animateMotion dur="4.5s" begin="3s" repeatCount="indefinite"><mpath href="#route" xlink:href="#route"/></animateMotion></circle>

<!-- reply ticker -->
<rect x="700" y="346" width="430" height="36" rx="8" fill="#07101f" stroke="#1f3a5c"/>
<text x="716" y="369" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" fill="#8aa4bf">ping 10.0.1.10 ...
<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.55;0.6;1" dur="4.5s" repeatCount="indefinite"/></text>
<text x="716" y="369" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" fill="#34d399" opacity="0">reply from 10.0.1.10  ttl=253  tunnel up
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.6;1" dur="4.5s" repeatCount="indefinite"/></text>
</svg>
