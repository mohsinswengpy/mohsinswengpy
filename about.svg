h="0" height="1.5" fill="#22e58a" fill-opacity="0.8"><animate attributeName="width" from="0" to="46" dur="0.7s" begin="2.55s" fill="freeze"/></rect><text x="60" y="394" font-size="12" letter-spacing="3.5" font-weight="700" fill="#22e58a" font-family="Consolas,'Cascadia Mono','DejaVu Sans Mono','Courier New',monospace">OPEN</text><text x="130" y="394" font-size="17" fill="#d6e7f8" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif">Junior roles  ·  Internships  ·  Freelance work</text><circle cx="52" cy="389" r="4" fill="#22e58a"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle></g>
