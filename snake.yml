name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate custom neon snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff2d87&color_dots=#ebedf0,#c9ecf9,#7fd0f0,#049FD9,#7B2FF7
            dist/github-snake-dark.svg?color_snake=#ff4d8d&color_dots=#161b22,#0e4a63,#0a7aa6,#00c8ff,#9d5cff

      - name: Add neon glow
        run: |
          for f in dist/github-snake.svg dist/github-snake-dark.svg; do
            if grep -q '<svg[^>]*style=' "$f"; then
              echo "style already present in $f, skipping"
            elif [ "$f" = "dist/github-snake-dark.svg" ]; then
              sed -i '0,/<svg/s//<svg style="filter:drop-shadow(0 0 3px rgba(157,92,255,0.9))"/' "$f"
            else
              sed -i '0,/<svg/s//<svg style="filter:drop-shadow(0 0 2px rgba(4,159,217,0.6))"/' "$f"
            fi
          done

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
