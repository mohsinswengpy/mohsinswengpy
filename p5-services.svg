    <text x="30" y="86" font-size="23" font-weight="800" fill="url(#titleG)" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" opacity="0">DHCP, NAT &amp; ACL<animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.2s" fill="freeze"/></text><text x="30" y="114" font-size="23" font-weight="800" fill="url(#titleG)" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" opacity="0">Networking Lab<animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.32s" fill="freeze"/></text>
    <text x="30" y="144" font-size="13.5" fill="#a9c1dc" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" opacity="0">Automatic addressing, NAT/PAT to<animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.6s" fill="freeze"/></text><text x="30" y="165" font-size="13.5" fill="#a9c1dc" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" opacity="0">reach the internet, and ACLs that<animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.75s" fill="freeze"/></text><text x="30" y="186" font-size="13.5" fill="#a9c1dc" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" opacity="0">control which traffic is allowed.<animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.8999999999999999s" fill="freeze"/></text>
