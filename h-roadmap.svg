<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 84" width="1280" height="84">
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#049FD9"/><stop offset="55%" stop-color="#7B2FF7"/><stop offset="100%" stop-color="#ff2d87" stop-opacity="0"/></linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#9fd8ff"/></linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif">
    <polygon transform="translate(72,36)" points="0,-9 9,0 0,9 -9,0" fill="none" stroke="#8fdcff" stroke-width="1.8" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.2s" fill="freeze"/></polygon>
    <polygon transform="translate(72,36)" points="0,-3.5 3.5,0 0,3.5 -3.5,0" fill="#8fdcff" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.2s" fill="freeze"/><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" begin="1.2s" repeatCount="indefinite"/></polygon>
    <text x="96" y="30" font-size="12" letter-spacing="4" fill="#6f8fb0" font-family="Consolas,'Cascadia Mono','DejaVu Sans Mono','Courier New',monospace" opacity="0">// 05<animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.2s" fill="freeze"/></text>
    <text x="96" y="52" font-size="34" font-weight="800" fill="url(#tg)" letter-spacing="0.5" opacity="0">Roadmap<animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.2s" fill="freeze"/><animate attributeName="letter-spacing" from="8" to="0.5" dur="1.2s" begin="0.2s" fill="freeze"/></text>
    <rect x="60" y="64" width="0" height="2" rx="1" fill="url(#ln)"><animate attributeName="width" from="0" to="1160" dur="1.4s" begin="0.5s" fill="freeze"/></rect>
    <circle cy="66" r="3" fill="#fff" filter="url(#glow)" opacity="0"><animate attributeName="cx" values="60;1220" dur="4.5s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4.5s" begin="2.2s" repeatCount="indefinite"/></circle>
